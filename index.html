<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>학생회 물품 대여 장부</title>

<style>
body { font-family: Arial, sans-serif; margin: 20px; background:#ffffff; }
h1 { margin-bottom:10px; }

.notice-box {
  background:#f7f7f7;
  border:1px solid #ddd;
  padding:10px 14px;
  margin-bottom:14px;
  font-size:14px;
  line-height:1.7;
}

.top-area { margin-bottom:15px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.form-area { margin-bottom:20px; }

select, input, button {
  padding:6px;
  margin-right:6px;
  font-size:14px;
}

table { width:100%; border-collapse:collapse; }
th, td {
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
  font-size:14px;
}
th { background:#f2f2f2; }

button { cursor:pointer; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.reset-btn { background:#eee; }

.date-label {
  font-size: 14px;
  color: #888;
  margin-left: 10px;
  font-weight: normal;
}

.badge {
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  font-size:12px;
  border:1px solid #ddd;
}
.badge.available { background:#f7fff7; }
.badge.rented { background:#fff7f7; border-color:#f2c9c9; }

.mode-pill {
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid #ddd;
  border-radius:999px;
  background:#fff;
  font-size:13px;
}
.mode-dot {
  width:10px; height:10px; border-radius:50%;
  background:#bbb;
}
.mode-dot.admin { background:#2e7d32; }
.mode-dot.view { background:#999; }

.small { font-size:12px; color:#666; }

.a4-box{
  border:1px solid #ddd;
  background:#fbfbfb;
  padding:10px 12px;
  border-radius:6px;
  margin-bottom:12px;
}
.a4-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.a4-total{ font-size:13px; color:#444; }
.a4-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>

<h1>
  학생회 물품 대여 장부
  <span id="todayLabel" class="date-label"></span>
</h1>

<div class="notice-box">
✔ 물품 대여는 운영 시간인 <b>10시~18시</b> 내에만 가능합니다.<br>
✔ 반납은 학생회 담당자의 확인이 필요합니다.
</div>

<div class="top-area">
  <span class="mode-pill">
    <span class="mode-dot view" id="modeDot"></span>
    <span id="modeText">조회 전용 모드</span>
  </span>

  <button id="adminSetBtn">E:ON 접속</button>
  <button id="adminClearBtn">E:ON 로그아웃</button>
  <button class="reset-btn" id="resetBtn">초기화 (새 장부)</button>
</div>

<!-- ✅ A4 최상단 -->
<div class="a4-box">
  <div class="a4-title">
    <b>📄 A4 사용 기록</b>
    <span class="a4-total">
      전체 누적: <b id="a4TotalLabel">0</b>장
    </span>
  </div>

  <div class="a4-row">
    <input id="a4NameInput" placeholder="이름">
    <input id="a4StudentInput" placeholder="학번">
    <input id="a4CountInput" type="number" min="1" placeholder="사용 장수">
    <button id="a4AddBtn">A4 사용 기록</button>
    <span id="a4TodayLabel" class="small">오늘 누적: 0장</span>
  </div>
</div>

<script>
const ADMIN_TOKEN_KEY = "정찬";
const A4_TOTAL_KEY = "a4_total_v1";

let a4TodayCount = 0;

/* 날짜 표시 */
(function(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  document.getElementById("todayLabel").textContent=`(${y}.${m}.${day} 기준)`;
})();

/* 관리자 모드 */
function isAdmin(){ return !!localStorage.getItem(ADMIN_TOKEN_KEY); }

function setModeUI(){
  const dot=document.getElementById("modeDot");
  const text=document.getElementById("modeText");
  if(isAdmin()){
    dot.classList.add("admin");
    dot.classList.remove("view");
    text.textContent="E:ON 관리자 모드";
  }else{
    dot.classList.add("view");
    dot.classList.remove("admin");
    text.textContent="조회 전용 모드";
  }
  document.getElementById("a4AddBtn").disabled=!isAdmin();
}

document.getElementById("adminSetBtn").onclick=()=>{
  const t=prompt("관리자 비밀번호 입력");
  if(t) localStorage.setItem(ADMIN_TOKEN_KEY,t.trim());
  setModeUI();
};
document.getElementById("adminClearBtn").onclick=()=>{
  localStorage.removeItem(ADMIN_TOKEN_KEY);
  setModeUI();
};

/* A4 전체 누적 */
function getTotal(){ return Number(localStorage.getItem(A4_TOTAL_KEY)||0); }
function setTotal(n){
  localStorage.setItem(A4_TOTAL_KEY,n);
  document.getElementById("a4TotalLabel").textContent=n;
}

/* 오늘 누적 */
function setTodayLabel(){
  document.getElementById("a4TodayLabel").textContent=`오늘 누적: ${a4TodayCount}장`;
}

/* A4 기록 */
document.getElementById("a4AddBtn").onclick=()=>{
  if(!isAdmin()) return alert("관리자만 기록 가능");

  const name=document.getElementById("a4NameInput").value.trim();
  const student=document.getElementById("a4StudentInput").value.trim();
  const count=Number(document.getElementById("a4CountInput").value);

  if(!name||!student) return alert("이름/학번 입력");
  if(!Number.isInteger(count)||count<=0) return alert("장수는 1 이상 정수");

  const total=getTotal()+count;
  setTotal(total);

  a4TodayCount+=count;
  setTodayLabel();

  document.getElementById("a4NameInput").value="";
  document.getElementById("a4StudentInput").value="";
  document.getElementById("a4CountInput").value="";
};

/* 초기화 */
document.getElementById("resetBtn").onclick=()=>{
  if(!isAdmin()) return alert("관리자만 초기화 가능");
  if(!confirm("전체 초기화하시겠습니까?")) return;
  localStorage.removeItem(A4_TOTAL_KEY);
  setTotal(0);
  a4TodayCount=0;
  setTodayLabel();
};

/* 초기 실행 */
setTotal(getTotal());
a4TodayCount=0;
setTodayLabel();
setModeUI();
</script>

</body>
</html>
